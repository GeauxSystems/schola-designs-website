<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Study | Schola Designs</title>
<meta name="description" content="A closer look at how Schola Designs worked with this client.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--orange:#F25C05;
    --black:#000000;
    --white:#FFFFFF;
    --gutter:clamp(20px,5vw,72px);
    --maxw:1400px;
    --fs-display:clamp(2.1rem,8.4vw,4.5rem);
    --lh-display:.94;
    --fs-close:clamp(1.4rem,5.5vw,2.5rem);
    --lh-close:1.05;
    --fs-sub:clamp(1.14rem,4.4vw,1.5rem);
    --fs-body:clamp(1.02rem,3.9vw,1.24rem);
    --col-gap:clamp(28px,5vw,72px);
    --pad-section:clamp(64px,10vw,132px);
    --ease:160ms ease;
    --btn-pad:20px 34px;
    --btn-gap:26px;}

  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
  body{margin:0;background:var(--white);color:var(--black);
    font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-weight:600;-webkit-font-smoothing:antialiased;}
  img,svg{display:block;max-width:100%;}
  a{color:inherit;}
  button{font-family:inherit;}
  :focus-visible{outline:3px solid var(--orange);outline-offset:3px;}
  .shell{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gutter);}

  .btn{display:inline-flex;align-items:center;justify-content:space-between;gap:var(--btn-gap);
    background:var(--orange);color:var(--white);text-decoration:none;
    font-weight:700;text-transform:uppercase;letter-spacing:.14em;
    line-height:1;border:0;cursor:pointer;font-size:clamp(.8rem,2.9vw,1rem);
    width:100%;padding:var(--btn-pad);justify-content:center;}
  .btn{transition:background var(--ease);}
  .btn:hover{background:var(--black);}
  .btn__arrow{width:34px;height:12px;flex:0 0 auto;}
  @media (min-width:900px){ .btn{width:auto;justify-content:space-between;} }

  .ghost-link{display:inline-flex;align-items:center;gap:10px;
    font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.16em;
    color:var(--black);text-decoration:none;border-bottom:2px solid var(--black);
    padding-bottom:6px;background:none;border-top:0;border-left:0;border-right:0;cursor:pointer;}
  .ghost-link:hover{border-bottom-color:var(--orange);}
  .ghost-link svg{width:22px;height:8px;flex:0 0 auto;}

  .eyebrow{display:flex;align-items:center;gap:16px;margin:0 0 clamp(18px,2.4vw,26px);
    font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.28em;color:var(--orange);}
  .eyebrow::before{content:"";display:block;width:44px;height:3px;background:var(--orange);flex:0 0 auto;}

  .masthead{display:flex;align-items:center;justify-content:space-between;
    gap:24px;padding-block:clamp(18px,3vw,30px);}
  .masthead__logo{display:block;flex:0 0 auto;}
  .masthead__logo svg{height:clamp(32px,7vw,34px);width:auto;}
  .masthead__nav{display:none;}
  .masthead__links{display:flex;gap:clamp(20px,3vw,42px);list-style:none;margin:0;padding:0;}
  .masthead__links a{text-decoration:none;font-size:.95rem;font-weight:600;
    padding-block:6px;border-bottom:2px solid transparent;}
  .masthead__links a:hover{border-bottom-color:var(--orange);}
  .masthead__cta{display:none;}
  .btn--nav{padding:14px 22px;font-size:.72rem;letter-spacing:.16em;gap:0;width:auto;}
  .burger{appearance:none;border:0;background:none;padding:8px;margin:-8px;cursor:pointer;flex:0 0 auto;}
  .burger span{display:block;width:30px;height:3px;background:var(--black);margin:5px 0;}

  .menu{position:fixed;inset:0;background:var(--black);color:var(--white);
    z-index:50;display:flex;flex-direction:column;padding:clamp(20px,5vw,40px);}
  .menu[hidden]{display:none;}
  .menu__top{display:flex;justify-content:flex-end;}
  .menu__close{appearance:none;background:none;border:0;color:var(--white);
    font-size:2.4rem;line-height:1;cursor:pointer;padding:4px 8px;}
  .menu__list{list-style:none;margin:auto 0;padding:0;display:grid;gap:22px;}
  .menu__list a{text-decoration:none;text-transform:uppercase;font-weight:800;
    letter-spacing:-.01em;font-size:clamp(1.9rem,9vw,2.6rem);color:var(--white);}
  .menu__list a:hover{color:var(--orange);}
  .menu .btn{width:100%;padding:var(--btn-pad);}
  @media (min-width:900px){
    .burger{display:none;}
    .masthead__nav{display:block;}
    .masthead__cta{display:inline-flex;}
  }
  @media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto;} *{transition:none!important;} }

  .site-footer{background:var(--black);color:rgba(255,255,255,.72);
    padding-top:clamp(36px,5.5vw,52px);padding-bottom:clamp(28px,4vw,40px);
    border-top:1px solid rgba(255,255,255,.14);}
  .footer__top{display:flex;flex-direction:column;align-items:center;gap:clamp(24px,4vw,0px);text-align:center;}
  .footer__logo{display:block;}
  .footer__logo svg{height:clamp(22px,5vw,28px);width:auto;}
  .footer__nav{list-style:none;margin:0 auto;padding:0;max-width:300px;
    display:flex;flex-wrap:wrap;justify-content:center;gap:12px clamp(16px,3vw,32px);}
  .footer__nav a{color:rgba(255,255,255,.72);text-decoration:none;font-size:.86rem;font-weight:600;}
  .footer__nav a:hover{color:var(--white);}
  .footer__bottom{margin-top:clamp(28px,4vw,36px);padding-top:clamp(20px,2.8vw,26px);
    border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;
    align-items:center;gap:10px;text-align:center;}
  .footer__copy{font-size:.78rem;font-weight:500;color:rgba(255,255,255,.5);}
  @media (min-width:900px){
    .footer__nav{max-width:none;margin:0;}
    .footer__top{flex-direction:row;justify-content:space-between;text-align:left;}
    .footer__bottom{flex-direction:row;justify-content:space-between;text-align:left;}
  }

  /* ---------- case study detail (the homepage's Pelican "proof" pattern, full page) ---------- */
  .cs-detail{padding-block:clamp(28px,5vw,56px) var(--pad-section);}
  .cs-detail__back{display:inline-flex;margin-bottom:clamp(28px,4vw,40px);}
  .cs-detail__notready{max-width:640px;}
  .cs-detail__notready p{font-size:var(--fs-body);font-weight:500;line-height:1.55;
    max-width:56ch;margin:0 0 clamp(16px,2.4vw,22px);}
  .cs-detail__notready h1{font-size:var(--fs-close);line-height:var(--lh-close);
    font-weight:800;letter-spacing:-.015em;margin:0 0 clamp(20px,3vw,28px);}

  .proof__client{margin:clamp(6px,1vw,10px) 0 0;font-size:.72rem;font-weight:700;
    text-transform:uppercase;letter-spacing:.24em;color:rgba(0,0,0,.55);}
  .proof__chapter{margin:clamp(10px,1.4vw,14px) 0 0;font-weight:600;
    font-size:clamp(1rem,3.8vw,1.14rem);line-height:1.45;max-width:60ch;}
  .proof__head{margin:clamp(18px,2.4vw,26px) 0 0;font-weight:800;text-transform:uppercase;
    font-size:var(--fs-display);line-height:var(--lh-display);letter-spacing:-.022em;max-width:20ch;}
  .proof__head .hi{color:var(--orange);}

  /* ---------- case study photos (mobile first: full-width, 4:3; widens to 16:9 at desktop) ---------- */
  .cs-photo{margin:clamp(28px,4.5vw,40px) 0 0;aspect-ratio:4/3;overflow:hidden;background:rgba(0,0,0,.04);}
  .cs-photo img{width:100%;height:100%;object-fit:cover;}
  .cs-photo--placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(10px,1.6vw,14px);border:2px dashed rgba(0,0,0,.16);padding:clamp(28px,5vw,40px);text-align:center;}
  .cs-photo--placeholder svg{width:clamp(32px,6vw,40px);height:clamp(32px,6vw,40px);color:rgba(0,0,0,.28);}
  .cs-photo--placeholder span{font-size:.74rem;font-weight:700;text-transform:uppercase;
    letter-spacing:.14em;color:rgba(0,0,0,.38);}

  .cs-photo-secondary{margin:clamp(34px,5vw,48px) 0 0;aspect-ratio:4/3;overflow:hidden;max-width:720px;}
  .cs-photo-secondary img{width:100%;height:100%;object-fit:cover;}

  @media (min-width:900px){
    .cs-photo{aspect-ratio:16/9;}
    .cs-photo-secondary{aspect-ratio:16/10;}
  }

  .ba{list-style:none;margin:clamp(34px,5vw,60px) 0 0;padding:0;display:grid;gap:clamp(18px,2.4vw,26px);}
  .ba li{padding:clamp(24px,3.4vw,40px);}
  .ba__before{background:rgba(0,0,0,.05);}
  .ba__after{background:var(--black);color:var(--white);}
  .ba__label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.24em;
    padding-bottom:clamp(12px,1.6vw,16px);border-bottom:1px solid rgba(0,0,0,.2);}
  .ba__after .ba__label{border-bottom-color:rgba(255,255,255,.28);}
  .ba__state{margin:clamp(16px,2.2vw,22px) 0 0;font-weight:600;
    font-size:clamp(1.3rem,5vw,1.9rem);line-height:1.18;letter-spacing:-.015em;}
  .ba__note{margin:clamp(12px,1.6vw,16px) 0 0;font-weight:500;font-size:clamp(.98rem,3.7vw,1.06rem);line-height:1.5;}
  .ba__arrow{display:grid;place-items:center;color:var(--orange);}
  .ba__arrow svg{width:34px;height:34px;transform:rotate(90deg);}

  .receipt{margin:clamp(38px,5vw,64px) 0 0;}
  .receipt__mark{display:block;color:var(--orange);font-weight:800;line-height:.7;font-size:clamp(3rem,9vw,4.6rem);}
  .receipt blockquote{margin:clamp(6px,1vw,10px) 0 0;font-weight:500;font-style:italic;
    font-size:clamp(1.14rem,4.4vw,1.6rem);line-height:1.42;max-width:44ch;}
  .receipt figcaption{margin:clamp(20px,2.6vw,26px) 0 0;display:flex;align-items:center;gap:16px;}
  .receipt figcaption::before{content:"";width:34px;height:3px;background:var(--orange);flex:0 0 auto;}
  .receipt__who{font-weight:700;font-size:clamp(1rem,3.8vw,1.08rem);}
  .receipt__role{display:block;font-weight:500;font-size:clamp(.92rem,3.5vw,1rem);color:rgba(0,0,0,.62);}

  @media (min-width:900px){
    .ba{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;gap:clamp(20px,2.6vw,32px);}
    .ba__arrow svg{transform:none;}
  }

  .cs-stats{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    border-top:1px solid rgba(0,0,0,.12);border-bottom:1px solid rgba(0,0,0,.12);
    padding-block:clamp(22px,3vw,30px);margin:clamp(38px,5vw,56px) 0 0;max-width:720px;}
  .cs-stat__value{font-size:1.9rem;font-weight:800;color:var(--orange);line-height:1;margin:0 0 6px;}
  .cs-stat__label{font-size:.85rem;font-weight:600;color:rgba(0,0,0,.7);line-height:1.35;margin:0;}

  .cs-body{max-width:720px;margin:clamp(48px,6vw,68px) 0 0;}
  .cs-body h2{font-size:var(--fs-sub);font-weight:800;letter-spacing:-.01em;
    margin:clamp(30px,4vw,40px) 0 clamp(12px,1.8vw,16px);}
  .cs-body h2:first-child{margin-top:0;}
  .cs-body p{font-size:var(--fs-body);font-weight:500;line-height:1.6;margin:0 0 clamp(14px,2vw,18px);}

  .cs-detail__cta{margin-top:clamp(40px,5.5vw,56px);padding-top:clamp(30px,4vw,40px);
    border-top:1px solid rgba(0,0,0,.12);max-width:720px;}
</style>
</head>

<script>
(function(){
  "use strict";

  function escapeHtml(str){
    return String(str || "").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // Wraps a phrase inside a larger block of text in the orange highlight
  // span. Both strings are escaped first, so nothing typed into the CMS
  // can inject markup; the editor only ever types plain sentences.
  function highlight(text, phrase){
    var safeText = escapeHtml(text || "");
    var safePhrase = escapeHtml((phrase || "").trim());
    if (!safePhrase) return safeText;
    var idx = safeText.indexOf(safePhrase);
    if (idx === -1) return safeText;
    return (
      safeText.slice(0, idx) +
      '<span class="hi">' + safePhrase + '</span>' +
      safeText.slice(idx + safePhrase.length)
    );
  }

  var arrow = '<svg class="btn__arrow" viewBox="0 0 34 12" aria-hidden="true"><path d="M0 6h31M26 1l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
  var backArrow = '<svg viewBox="0 0 34 12" aria-hidden="true"><path d="M0 6h31M26 1l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';

  // Slug comes from the URL path, /work/<slug>, not a query string, e.g.
  // /work/pelican-sweets -> "pelican-sweets". Falls back gracefully if this
  // file is opened directly (no slug segment) or the slug doesn't match.
  var segments = window.location.pathname.split("/").filter(Boolean);
  var slug = segments.length ? segments[segments.length - 1].replace(/\.html?$/i, "") : "";
  if (slug === "work") slug = ""; // opened at /work with nothing after it

  var container = document.getElementById("csDetail");

  fetch("/content/case-studies.json")
    .then(function(res){ return res.json(); })
    .then(function(data){
      var list = data.case_studies || [];
      var cs = list.find(function(item){ return item.slug === slug; });
      render(cs);
    })
    .catch(function(){
      render(null);
    });

  function render(cs){
  if (!cs || cs.status !== "published") {
    container.innerHTML =
      '<a class="ghost-link cs-detail__back" href="/case-studies">' + backArrow + ' All case studies</a>' +
      '<div class="cs-detail__notready">' +
        '<p class="eyebrow">Case study</p>' +
        '<h1>This one isn&rsquo;t ready yet.</h1>' +
        '<p>The write-up you&rsquo;re looking for hasn&rsquo;t been published. Take a look at the case studies that are ready, or head back to the homepage.</p>' +
        '<div class="cs-detail__cta"><a class="btn" href="/case-studies">See the case studies ' + arrow + '</a></div>' +
      '</div>';
    document.title = "Case Study Not Found | Schola Designs";
    initMenu();
    return;
  }

  document.title = escapeHtml(cs.client) + " Case Study | Schola Designs";

  var html = '<a class="ghost-link cs-detail__back" href="/case-studies">' + backArrow + ' All case studies</a>';
  html += '<p class="eyebrow">Case study</p>';
  html += '<p class="proof__client">' + escapeHtml(cs.client) + '</p>';
  if (cs.chapter) {
    html += '<p class="proof__chapter">' + escapeHtml(cs.chapter) + '</p>';
  }
  html += '<h2 class="proof__head">' + highlight(cs.title, cs.titleHighlight) + '</h2>';

  var photoIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">' +
    '<rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="8.5" cy="10.5" r="1.6"/><path d="M21 16l-5.5-5.5L9 17"/></svg>';

  if (cs.photo) {
    html += '<figure class="cs-photo"><img src="' + escapeHtml(cs.photo) + '" alt="' + escapeHtml(cs.photoAlt || "") + '" loading="lazy"></figure>';
  } else {
    html += '<div class="cs-photo cs-photo--placeholder">' + photoIcon + '<span>Photo coming soon</span></div>';
  }

  if (cs.before || cs.after) {
    html += '<ul class="ba">';
    html += '<li class="ba__before"><span class="ba__label">Before</span>' +
      '<p class="ba__state">' + escapeHtml(cs.before || "") + '</p>' +
      (cs.beforeNote ? '<p class="ba__note">' + escapeHtml(cs.beforeNote) + '</p>' : '') +
      '</li>';
    html += '<li class="ba__arrow" aria-hidden="true"><svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 17h24M22 9l8 8-8 8"/></svg></li>';
    html += '<li class="ba__after"><span class="ba__label">After</span>' +
      '<p class="ba__state">' + escapeHtml(cs.after || "") + '</p>' +
      (cs.afterNote ? '<p class="ba__note">' + escapeHtml(cs.afterNote) + '</p>' : '') +
      '</li>';
    html += '</ul>';
  }

  if (cs.quoteText) {
    html += '<figure class="receipt"><span class="receipt__mark" aria-hidden="true">&ldquo;</span>' +
      '<blockquote>' + escapeHtml(cs.quoteText) + '</blockquote>' +
      '<figcaption><span><span class="receipt__who">' + escapeHtml(cs.quoteName || "") + '</span>' +
      '<span class="receipt__role">' + escapeHtml(cs.quoteRole || "") + '</span></span></figcaption>' +
      '</figure>';
  }

  if (cs.secondaryPhoto) {
    html += '<figure class="cs-photo-secondary"><img src="' + escapeHtml(cs.secondaryPhoto) + '" alt="' + escapeHtml(cs.secondaryPhotoAlt || "") + '" loading="lazy"></figure>';
  }

  if (cs.stats && cs.stats.length) {
    html += '<div class="cs-stats">';
    cs.stats.forEach(function(stat){
      html += '<div class="cs-stat"><p class="cs-stat__value">' + escapeHtml(stat.value) + '</p><p class="cs-stat__label">' + escapeHtml(stat.label) + '</p></div>';
    });
    html += '</div>';
  }

  if (cs.body && cs.body.length) {
    html += '<div class="cs-body">';
    cs.body.forEach(function(section){
      if (section.heading) {
        html += '<h2>' + escapeHtml(section.heading) + '</h2>';
      }
      (section.paragraphs || []).forEach(function(para){
        html += '<p>' + escapeHtml(para) + '</p>';
      });
    });
    html += '</div>';
  }

  html += '<div class="cs-detail__cta"><a class="btn" href="/fit-assessment">See if we&rsquo;re a fit ' + arrow + '</a></div>';

  container.innerHTML = html;
  initMenu();
  }

  function initMenu(){
    var menu = document.getElementById("menu");
    var burger = document.querySelector(".burger");
    var menuClose = document.querySelector(".menu__close");

    function openMenu(){
      menu.hidden = false;
      burger.setAttribute("aria-expanded", "true");
    }
    function shutMenu(){
      menu.hidden = true;
      burger.setAttribute("aria-expanded", "false");
    }
    burger.addEventListener("click", openMenu);
    menuClose.addEventListener("click", shutMenu);
  }

})();
</script>
